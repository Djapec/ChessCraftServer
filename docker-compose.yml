version: '3.8'

services:
  app:
    build:
      context: .
      target: ${NODE_ENV:-production}
    container_name: chesscraftserver
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:3333"
    volumes:
      - ./uploads:/app/uploads
      - ./src:/app/src:ro
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3333}
      - MONGO_URI=${MONGO_URI}
#      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
#    depends_on:
#      - redis
    networks:
      - chesscraft-network

  dev:
    build:
      context: .
      target: deps
    container_name: chesscraftserver-dev
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${PORT:-3333}:3333"
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3333}
      - MONGO_URI=${MONGO_URI}
#      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
#    depends_on:
#      - redis
    networks:
      - chesscraft-network
    profiles: ["dev"]

#  redis:
#    image: redis:7-alpine
#    container_name: chesscraft-redis
#    restart: unless-stopped
#    ports:
#      - "6379:6379"
#    volumes:
#      - redis-data:/data
#    networks:
#      - chesscraft-network

networks:
  chesscraft-network:
    driver: bridge
